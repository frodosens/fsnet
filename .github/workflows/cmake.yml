name: CMake
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {build_type: Debug, lua: 'ON'}
          - {build_type: Release, lua: 'ON'}
          - {build_type: Debug, lua: 'OFF'}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DFSNET_WITH_LUA=${{ matrix.lua }}
      - run: cmake --build build -j4
      - run: ctest --test-dir build --output-on-failure
      - name: Package and validate relocated release
        if: matrix.build_type == 'Release' && matrix.lua == 'ON'
        run: |
          cpack --config build/CPackConfig.cmake -B packages
          mkdir relocated
          tar -xzf packages/*.tar.gz -C relocated --strip-components=1
          python3 relocated/share/fsnet/examples/run.py scene
          python3 relocated/share/fsnet/examples/run.py scene --native
          python3 relocated/share/fsnet/examples/run.py attributes
          python3 relocated/share/fsnet/examples/run.py timers
      - uses: actions/upload-artifact@v4
        if: matrix.build_type == 'Release' && matrix.lua == 'ON'
        with:
          name: fsnet-release
          path: |
            packages/*.tar.gz
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-tests-${{ matrix.build_type }}-lua-${{ matrix.lua }}
          path: build/Testing/Temporary/
          if-no-files-found: ignore
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFSNET_SANITIZERS=ON
      - run: cmake --build build -j4
      - run: ctest --test-dir build --output-on-failure
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-tests-sanitize
          path: build/Testing/Temporary/
          if-no-files-found: ignore

  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y bison flex m4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFSNET_WITH_POSTGRES=ON -DFSNET_POSTGRES_TEST_SERVER=ON
      - run: cmake --build build -j4
      - run: ctest --test-dir build --output-on-failure
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-tests-postgres
          path: build/Testing/Temporary/
          if-no-files-found: ignore
