name: CMake
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {build_type: Debug, lua: 'ON', ruby: 'ON'}
          - {build_type: Release, lua: 'ON', ruby: 'ON'}
          - {build_type: Debug, lua: 'OFF', ruby: 'OFF'}
          - {build_type: Debug, lua: 'ON', ruby: 'OFF'}
          - {build_type: Debug, lua: 'OFF', ruby: 'ON'}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        if: matrix.ruby == 'ON'
        with:
          ruby-version: '3.3'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DFSNET_WITH_LUA=${{ matrix.lua }} -DFSNET_WITH_RUBY=${{ matrix.ruby }}
      - run: cmake --build build -j4
      - run: ctest --test-dir build --output-on-failure
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFSNET_SANITIZERS=ON
      - run: cmake --build build -j4
      - run: ctest --test-dir build --output-on-failure

  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y bison flex m4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFSNET_WITH_POSTGRES=ON -DFSNET_POSTGRES_TEST_SERVER=ON -DFSNET_WITH_RUBY=OFF
      - run: cmake --build build -j4
      - run: ctest --test-dir build --output-on-failure
