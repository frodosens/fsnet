name: CMake
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {build_type: Debug, lua: 'ON'}
          - {build_type: Release, lua: 'ON'}
          - {build_type: Debug, lua: 'OFF'}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DFSNET_WITH_LUA=${{ matrix.lua }}
      - run: cmake --build build -j4
      - run: ctest --test-dir build --output-on-failure
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFSNET_SANITIZERS=ON
      - run: cmake --build build -j4
      - run: ctest --test-dir build --output-on-failure

  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y bison flex m4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFSNET_WITH_POSTGRES=ON -DFSNET_POSTGRES_TEST_SERVER=ON
      - run: cmake --build build -j4
      - run: ctest --test-dir build --output-on-failure
